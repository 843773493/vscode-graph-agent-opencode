[project]
name = "boxteam"
version = "0.1.0"
description = "VS Code AI 编程助手后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "httpx>=0.27.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "debugpy>=1.8.1",
    "pytest-asyncio>=1.3.0",
    "jsonschema>=4.21.0",
    "cachetools>=5.3.0",
    "commentjson>=0.9.0",
    "langchain>=1.3.1",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.1.0",
    "langchain-tavily>=0.2.0",
    "langgraph>=1.0.0",
    "deepagents==0.6.2",
    "pytest-xdist>=3.8.0",
    "pydantic-to-typescript>=2.0.0",
    "langchain-litellm==0.7.0",
    "litellm>=1.93.0",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters==0.3.0",
    "mcp>=1.27,<2",
    "ddgs>=9.14.4",
    "websockets>=16.0",
    "watchfiles>=1.0.0",
    "pillow>=12.3.0",
    "croniter>=6.0.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "langchain-anthropic>=1.4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "unit: 单元测试",
    "contract: 跨进程或跨语言公开协议契约测试",
    "integration: 多模块集成测试，包含受控服务替身",
    "e2e: 端到端测试",
    "live_model: 需要真实外部模型的测试",
]
# TODO: Windows 未启用符号链接权限时，pytest 的 current 临时目录链接无法清理。
tmp_path_retention_policy = "none"
filterwarnings = [
    "ignore:module 'sre_parse' is deprecated:DeprecationWarning:lark.utils",
    "ignore:module 'sre_constants' is deprecated:DeprecationWarning:lark.utils",
]
