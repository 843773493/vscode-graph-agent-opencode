<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111827'/%3E%3Cpath d='M8 11l5 5-5 5M15 22h9' stroke='%23f8fafc' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>持久终端</title>
    <link rel="stylesheet" href="./vendor/codicon/codicon.css" />
    <link rel="stylesheet" href="./vendor/xterm/xterm.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="terminal-shell">
      <header class="terminal-toolbar">
        <div class="terminal-title">
          <strong>持久终端</strong>
          <span id="terminal-id">未选择终端</span>
        </div>
        <div class="terminal-actions">
          <button
            id="attach-toggle"
            class="icon-button terminal-icon-button"
            type="button"
            title="连接终端"
            aria-label="连接终端"
          >
            <span class="button-icon codicon codicon-vm-connect icon-connect" aria-hidden="true"></span>
            <span class="button-icon codicon codicon-debug-disconnect icon-disconnect" aria-hidden="true"></span>
            <span class="sr-only">连接终端</span>
          </button>
          <button
            id="search-terminal"
            class="icon-button terminal-icon-button"
            type="button"
            title="搜索终端内容（Ctrl+F / ⌘F）"
            aria-label="搜索终端内容"
          >
            <span class="button-icon codicon codicon-search" aria-hidden="true"></span>
            <span class="sr-only">搜索终端内容</span>
          </button>
          <button
            id="refresh-snapshot"
            class="icon-button terminal-icon-button"
            type="button"
            title="刷新终端状态"
            aria-label="刷新终端状态"
          >
            <span class="button-icon codicon codicon-refresh" aria-hidden="true"></span>
            <span class="sr-only">刷新终端状态</span>
          </button>
          <button
            id="terminate-terminal"
            class="icon-button terminal-icon-button danger-soft"
            type="button"
            title="终止终端进程"
            aria-label="终止终端进程"
          >
            <span class="button-icon codicon codicon-debug-stop" aria-hidden="true"></span>
            <span class="sr-only">终止终端进程</span>
          </button>
          <button
            id="delete-terminal"
            class="icon-button terminal-icon-button danger"
            type="button"
            title="删除终端记录"
            aria-label="删除终端记录"
          >
            <span class="button-icon codicon codicon-trash" aria-hidden="true"></span>
            <span class="sr-only">删除终端记录</span>
          </button>
        </div>
      </header>
      <section id="status-line" class="status-line" hidden role="alert"></section>
      <section class="terminal-stage">
        <section id="terminal-search-bar" class="terminal-search-bar" hidden>
          <input
            id="terminal-search-input"
            type="search"
            autocomplete="off"
            spellcheck="false"
            aria-label="搜索终端内容"
            placeholder="搜索终端内容"
          />
          <span id="terminal-search-result" class="terminal-search-result" aria-live="polite"></span>
          <button id="terminal-search-previous" class="icon-button terminal-icon-button" type="button" title="上一个匹配" aria-label="上一个匹配">
            <span class="button-icon codicon codicon-arrow-up" aria-hidden="true"></span>
          </button>
          <button id="terminal-search-next" class="icon-button terminal-icon-button" type="button" title="下一个匹配" aria-label="下一个匹配">
            <span class="button-icon codicon codicon-arrow-down" aria-hidden="true"></span>
          </button>
          <button id="terminal-search-close" class="icon-button terminal-icon-button" type="button" title="关闭搜索" aria-label="关闭搜索">
            <span class="button-icon codicon codicon-close" aria-hidden="true"></span>
          </button>
        </section>
        <section id="terminal" class="terminal"></section>
      </section>
    </main>
    <script src="./config.js"></script>
    <script src="./vendor/xterm/xterm.js"></script>
    <script src="./vendor/xterm/addon-fit.js"></script>
    <script src="./vendor/xterm/addon-search.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
