<!doctype html>
<html lang="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code - OSS</title>
<link rel="icon" type="image/png" sizes="32x32" href="/out/branding/favicon.png">
<link rel="stylesheet" href="/out/main.css">
<style>
html,body,#workbench{width:100%;height:100%;margin:0;overflow:hidden}
#startup-status, #startup-error, #startup-error button {
  font: 400 13px/1.4 var(--vscode-font-family, -apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, "Ubuntu", "Droid Sans", "Source Han Sans SC", "Source Han Sans CN", "Source Han Sans", sans-serif);
  letter-spacing: normal;
}
#startup-status {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  color: var(--vscode-foreground, #333);
  pointer-events: none;
}
#startup-error {
  position: absolute;
  inset: 16px;
  margin: 0;
  padding: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  overflow: auto;
  background: #351919;
  color: #fff;
  font-family: var(--monaco-monospace-font, ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace);
  line-height: 1.5;
  z-index: 10000;
}
#startup-error button {
  display: block;
  max-width: 100%;
  min-height: 28px;
  margin-top: 12px;
  padding: 4px 10px;
  border: 1px solid currentColor;
  border-radius: 3px;
  background: transparent;
  color: inherit;
  white-space: normal;
  text-align: left;
  cursor: pointer;
}
#startup-error button:focus-visible { outline: 1px solid currentColor; outline-offset: 2px; }
#startup-error:empty,body:has(.monaco-workbench) #startup-status{display:none}
</style>
<script>globalThis._VSCODE_FILE_ROOT = new URL('/out/', location.href).href;</script>
</head>
<body><div id="workbench"></div><div id="startup-status" role="status"></div><pre id="startup-error" role="alert"></pre>
<script>
// 在业务模块依赖图加载前显示失败，网络或模块错误不能留下白屏。
function showStartupError(error) {
  if (document.querySelector('.monaco-workbench')) return;
  document.getElementById('startup-status').textContent = error instanceof Error ? error.message : String(error);
  document.getElementById('startup-error').textContent = error instanceof Error ? error.stack ?? error.message : String(error);
}
window.addEventListener('error', event => {
  if (event.target instanceof HTMLScriptElement) showStartupError(`无法加载工作台脚本：${event.target.src}`);
  else if (event.error || event.message) showStartupError(event.error ?? event.message);
}, true);
window.addEventListener('unhandledrejection', event => showStartupError(event.reason));
</script>
<script type="module" src="/out/main.js"></script>
</body>
</html>
