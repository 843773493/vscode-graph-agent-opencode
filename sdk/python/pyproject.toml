[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boxteam-plugin-sdk"
version = "0.0.5"
description = "BoxTeam Python plugin SDK"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "jsonschema>=4.21.0",
    "pydantic>=2.6.0",
    "psutil>=5.9.0",
    "protobuf>=7.36.2,<8",
    "pywin32>=312; sys_platform == 'win32'",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["boxteam_plugin_sdk*", "boxteam*"]
namespaces = true

[tool.setuptools.package-data]
boxteam_plugin_sdk = ["resources/*"]
boxteam = ["**/*.pyi"]
