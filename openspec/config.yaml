schema: spec-driven

rules:
  design:
    - 普通交互须遵守 enforce-interactive-latency-budgets 的总预算；排队、校验、内部请求、重试和序列化都计入，不能只报局部 helper 耗时。
    - 完整性检查须写明权威 owner、触发边界与版本失效条件；禁止普通暖读无条件重复全库审计、全历史 hash/materialize 或另建防御性适配层。
  specs:
    - 涉及普通请求的验收须明确完整响应或真实可操作 UI 的计时终点；沿用既有更严格预算，不能用进程 timeout、加载占位或平均值掩盖单次慢请求。
  tasks:
    - 按风险增加少量真实入口性能场景，复用既有装具；记录数据规模、原始样本、p95/max、request_id和未验证范围，不默认全仓测试或重复长跑。
    - 不为完成任务新增生产性能监控或每请求全量自检；发现超预算先据原始证据归因，不放宽断言、关闭必要检查或擅改环境取绿。
