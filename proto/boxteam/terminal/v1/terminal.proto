syntax = "proto3";

package boxteam.terminal.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

enum TerminalStatus {
  TERMINAL_STATUS_UNSPECIFIED = 0;
  TERMINAL_STATUS_CREATED = 1;
  TERMINAL_STATUS_RUNNING = 2;
  TERMINAL_STATUS_EXITED = 3;
  TERMINAL_STATUS_TERMINATED = 4;
  TERMINAL_STATUS_DELETED = 5;
}

message TerminalSession {
  string terminal_id = 1;
  reserved 2, 4;
  reserved "session_id", "cwd";
  string title = 3;
  uint32 cols = 5;
  uint32 rows = 6;
  TerminalStatus status = 7;
  uint32 sequence = 8;
  google.protobuf.Struct metadata = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  string workspace_id = 12;
  string cwd_relative = 13;
  uint64 transport_owner_revision = 14;
  optional int32 exit_code = 15;
  optional int32 last_command_exit_code = 16;
  optional uint64 command_start_sequence = 17;
}

message TerminalJsonMessage {
  string type = 1;
  google.protobuf.Struct payload = 2;
}
