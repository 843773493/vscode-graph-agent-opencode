syntax = "proto3";

package boxteam.gateway.v2;

// 普通管理响应只公开元数据，密钥值仅作为瞬时写入参数。
message SecretMetadataDTO {
  string id = 1;
  string name = 2;
  uint64 revision = 3;
  string created_at = 4;
  string updated_at = 5;
}

message GatewaySecretsDTO {
  string gateway_id = 1;
  repeated SecretMetadataDTO items = 2;
}

message GatewaySecretDTO {
  string gateway_id = 1;
  SecretMetadataDTO item = 2;
}

message CreateSecretRequest {
  string name = 1;
  string value = 2;
  string id = 3;
}

message UpdateSecretRequest {
  uint64 expected_revision = 1;
  string name = 2;
  optional string value = 3;
}
