syntax = "proto3";

package boxteam.gateway.v2;

import "boxteam/gateway/v2/service_plugin.proto";

message PluginSkillSourceDTO {
  string package_id = 1;
  string plugin_id = 2;
  string package_version = 3;
  string package_digest = 4;
  string contribution_id = 5;
  optional string workspace_id = 6;
  repeated PluginToolBinding tool_bindings = 7;
}

// 认证控制面原始来源；不携带物理路径或凭据，不解释 Skill 语义。
message GatewaySkillSourceEntryDTO {
  string name = 1;
  string entry_identity = 2;
  string source_id = 3;
  string display_uri = 4;
  optional string revision = 5;
  uint64 byte_length = 6;
  string content = 7;
  bool available = 8;
  optional string error_code = 9;
  string layer = 10;
  int64 priority = 11;
  optional PluginSkillSourceDTO plugin = 12;
}

message GatewaySkillSourcesDTO {
  string gateway_id = 1;
  string workspace_id = 2;
  string revision = 3;
  repeated GatewaySkillSourceEntryDTO entries = 4;
  bool available = 5;
  optional string error_code = 6;
}

// 发现只使用已发布的身份与可用性，不传输 Skill 正文或原生获取地址。
message GatewaySkillSourceMetadataDTO {
  string name = 1;
  string display_uri = 2;
  bool available = 3;
  optional string error_code = 4;
  string layer = 5;
  int64 priority = 6;
  optional PluginSkillSourceDTO plugin = 7;
}

message GatewaySkillSourcesMetadataDTO {
  string gateway_id = 1;
  string workspace_id = 2;
  string revision = 3;
  repeated GatewaySkillSourceMetadataDTO entries = 4;
  bool available = 5;
  optional string error_code = 6;
}
