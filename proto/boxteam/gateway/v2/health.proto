syntax = "proto3";

package boxteam.gateway.v2;

import "boxteam/common/v1/service_lifecycle.proto";
import "boxteam/gateway/v2/public.proto";

message GatewayHealth {
  reserved 3;
  reserved "active_workspace_id";
  string gateway_id = 1;
  boxteam.common.v1.ServiceStatus status = 2;
  repeated boxteam.common.v1.ServiceHealth services = 4;
  uint64 process_id = 5;
  bool development_restart_available = 6;
  GatewaySearchWorkspaceOwnerDTO active_workspace = 7;
}
