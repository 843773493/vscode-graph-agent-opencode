syntax = "proto3";

package boxteam.gateway.v2;

import "google/protobuf/struct.proto";

// 插件声明、Gateway 绑定、实例回执及管理请求的跨语言公开合同。
// 扩展点具体业务规则仍由对应 owner 校验。
message PluginExtensionRequirement {
  string extension_point = 1;
  int32 version = 2;
}

message PluginServiceContribution {
  string service_id = 1;
  string service_type = 2;
  string protocol = 3;
}

message PluginToolBinding {
  string tool_id = 1;
  int32 contract_version = 2;
  optional string schema_hash = 3;
  optional string service_id = 4;
}

message PluginSkillContribution {
  string id = 1;
  string path = 2;
  repeated PluginToolBinding tool_bindings = 3;
}

message PluginCommandContribution {
  string id = 1;
  string title = 2;
  optional string category = 3;
  string handler = 4;
  google.protobuf.Struct arguments_schema = 5;
  google.protobuf.Struct result_schema = 6;
  repeated string required_capabilities = 7;
  optional string enablement = 8;
}

message PluginMenuContribution {
  string id = 1;
  string location = 2;
  string command_id = 3;
  optional string group = 4;
  optional int32 order = 5;
  optional string when = 6;
}

message PluginKeybindingContribution {
  string id = 1;
  string command_id = 2;
  optional string key = 3;
  optional string mac = 4;
  optional string linux = 5;
  optional string win = 6;
  optional string when = 7;
}

message PluginDebuggerContribution {
  string type = 1;
  string label = 2;
  google.protobuf.Struct configuration_schema = 3;
  string service_id = 4;
  int32 dap_version = 5;
  repeated string capabilities = 6;
}

message PluginContributions {
  repeated PluginCommandContribution commands = 1;
  repeated PluginMenuContribution menus = 2;
  repeated PluginKeybindingContribution keybindings = 3;
  optional google.protobuf.Struct configuration = 4;
  repeated PluginServiceContribution services = 5;
  repeated PluginDebuggerContribution debuggers = 6;
  repeated PluginSkillContribution skills = 7;
}

message ServicePluginManifest {
  string id = 1;
  string name = 2;
  string instance_scope = 3;
  repeated PluginExtensionRequirement requires = 4;
  PluginContributions contributes = 5;
  optional string runtime = 6;
  repeated string entrypoint = 7;
  optional int32 management_protocol_version = 8;
}

message PluginPackageManifest {
  int32 manifest_version = 1;
  string package_id = 2;
  string version = 3;
  string name = 4;
  optional string description = 5;
  int32 extension_contract_version = 6;
  repeated ServicePluginManifest plugins = 7;
  PluginPackageTarget target = 8;
}

message PluginRuntimeTarget {
  string version = 1;
  string abi = 2;
}

message PluginPackageTarget {
  string os = 1;
  string architecture = 2;
  string system_baseline = 3;
  PluginRuntimeTarget node = 4;
  PluginRuntimeTarget python = 5;
}

message PluginBinding {
  string package_id = 1;
  string plugin_id = 2;
  string package_version = 3;
  optional string workspace_id = 4;
  bool enabled = 5;
}

message PluginInstanceStatus {
  string package_id = 1;
  string package_version = 2;
  string plugin_id = 3;
  string instance_scope = 4;
  optional string workspace_id = 5;
  string instance_id = 6;
  int32 management_protocol_version = 7;
  int32 extension_contract_version = 8;
  string status = 9;
  int32 process_id = 10;
  optional google.protobuf.Struct log_sink = 11;
  repeated string capabilities = 12;
  repeated PluginServiceContribution services = 13;
  string gateway_id = 14;
}

message PluginInstanceView {
  string gateway_id = 1;
  string package_id = 2;
  string package_version = 3;
  string plugin_id = 4;
  string instance_scope = 5;
  optional string workspace_id = 6;
  string instance_id = 7;
  int32 management_protocol_version = 8;
  int32 extension_contract_version = 9;
  string status = 10;
  int32 process_id = 11;
  repeated string capabilities = 12;
  repeated PluginServiceContribution services = 13;
}

message InstalledPluginPackageDTO {
  PluginPackageManifest manifest = 1;
  string digest = 2;
}

message PluginSourceStatusDTO {
  bool configured = 1;
  string message = 2;
  repeated PluginSourceConfig entries = 3;
}

message PluginSourceConfig {
  string source_id = 1;
  int32 protocol_version = 2;
  optional string base_url = 3;
  bool enabled = 4;
}

message PluginSourceArtifact {
  string package_id = 1;
  string package_version = 2;
  PluginPackageTarget target = 3;
  string digest = 4;
  string url = 5;
  string filename = 6;
}

message PluginSourceCatalogRequest {
  string gateway_id = 1;
  optional string gateway_connection_id = 2;
  string source_id = 3;
  string query = 4;
  optional string cursor = 5;
}

message PluginSourceCatalogDTO {
  string gateway_id = 1;
  string source_id = 2;
  int32 protocol_version = 3;
  string catalog_revision = 4;
  repeated PluginSourceArtifact items = 5;
  optional string next_cursor = 6;
}

message FrozenPluginInstallArtifact {
  string source_kind = 1;
  string package_id = 2;
  string package_version = 3;
  PluginPackageTarget target = 4;
  string digest = 5;
  optional string source_id = 6;
  optional string catalog_revision = 7;
  optional string path = 8;
  reserved 9;
  optional string filename = 10;
}

message PluginInstallOperationRequest {
  string gateway_id = 1;
  optional string gateway_connection_id = 2;
  string operation_id = 3;
}

message PluginInstallOperationDTO {
  string gateway_id = 1;
  string operation_id = 2;
  string status = 3;
  FrozenPluginInstallArtifact artifact = 4;
  bool cancel_requested = 5;
  optional string error = 6;
}

message PluginInventoryResultDTO {
  repeated InstalledPluginPackageDTO packages = 1;
  PluginSourceStatusDTO sources = 2;
}

message PluginSlotStatusDTO {
  PluginBinding binding = 1;
  string revision = 2;
  string state = 3;
  optional string error = 4;
  bool declarative = 5;
  optional PluginInstanceView instance = 6;
  string gateway_id = 7;
  string instance_scope = 8;
  optional string log_id = 9;
}

message PluginRuntimeStatusDTO {
  repeated PluginSlotStatusDTO plugins = 1;
  repeated PluginBinding configured_bindings = 2;
  repeated WorkspacePluginConfigurationDTO workspace_configurations = 3;
}

message WorkspacePluginConfigurationDTO {
  string workspace_id = 1;
  string state = 2;
  optional string revision = 3;
  optional string error = 4;
}

message PluginUninstallResultDTO {
  string package_id = 1;
  string package_version = 2;
  bool uninstalled = 3;
}

message PluginTarget {
  string gateway_id = 1;
  optional string gateway_connection_id = 2;
}

// 已安装的静态配置贡献；读取不要求运行实例，也不制造绑定。
message PluginConfigurationSchemasRequest {
  string gateway_id = 1;
  optional string gateway_connection_id = 2;
  optional string workspace_id = 3;
}

message PluginConfigurationSchemaDTO {
  string package_id = 1;
  string package_version = 2;
  string plugin_id = 3;
  string name = 4;
  string instance_scope = 5;
  google.protobuf.Struct configuration_schema = 6;
}

message PluginConfigurationSchemasDTO {
  string gateway_id = 1;
  optional string workspace_id = 2;
  repeated PluginConfigurationSchemaDTO plugins = 3;
}

// 私有值只进入所属配置 owner 的受限文件；普通配置和回执保存引用。
message PluginPrivateInputReference {
  string kind = 1;
  string gateway_id = 2;
  optional string workspace_id = 3;
  string package_id = 4;
  string plugin_id = 5;
  string parameter_pointer = 6;
  string version = 7;
}

message PluginPrivateInputWriteRequest {
  string gateway_id = 1;
  optional string gateway_connection_id = 2;
  optional string workspace_id = 3;
  string package_id = 4;
  string plugin_id = 5;
  string parameter_pointer = 6;
  google.protobuf.Value value = 7;
  string package_version = 8;
  string source_key = 9;
}

message InstallPluginRequest {
  string gateway_id = 1;
  optional string gateway_connection_id = 2;
  string path = 3;
  bool development_directory = 4;
  optional string expected_digest = 5;
  string operation_id = 6;
  optional string source_id = 7;
  PluginSourceArtifact artifact = 8;
  optional string catalog_revision = 9;
}

message PluginVersionRequest {
  string gateway_id = 1;
  optional string gateway_connection_id = 2;
  string package_id = 3;
  string package_version = 4;
}

message RestartPluginRequest {
  string gateway_id = 1;
  optional string gateway_connection_id = 2;
  string package_id = 3;
  string package_version = 4;
  string plugin_id = 5;
  string revision = 6;
  optional string workspace_id = 7;
}

// 业务连接冻结的精确服务身份；不发布监听地址或管理凭据。
message PluginServiceReference {
  string gateway_id = 1;
  string package_id = 2;
  string package_version = 3;
  string plugin_id = 4;
  string instance_id = 5;
  string service_id = 6;
  optional string workspace_id = 7;
}
