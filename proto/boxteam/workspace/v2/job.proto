syntax = "proto3";

package boxteam.workspace.v2;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_ACCEPTED = 1;
  JOB_STATUS_QUEUED = 2;
  JOB_STATUS_RUNNING = 3;
  JOB_STATUS_STREAMING = 4;
  JOB_STATUS_WAITING_INPUT = 5;
  JOB_STATUS_PAUSED = 6;
  JOB_STATUS_INTERRUPT_PENDING = 7;
  JOB_STATUS_CANCELLING = 8;
  JOB_STATUS_COMPLETED = 9;
  JOB_STATUS_SUCCEEDED = 10;
  JOB_STATUS_FAILED = 11;
  JOB_STATUS_CANCELLED = 12;
  JOB_STATUS_TIMED_OUT = 13;
}

enum RunMode {
  RUN_MODE_UNSPECIFIED = 0;
  RUN_MODE_SINGLE_AGENT = 1;
  RUN_MODE_MULTI_AGENT = 2;
}

message Job {
  string job_id = 1;
  string message_id = 2;
  string session_id = 3;
  RunMode mode = 4;
  JobStatus status = 5;
  string entry_agent = 6;
  uint32 progress = 7;
  optional string current_step = 8;
  optional string error_message = 9;
  google.protobuf.Struct metadata = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  optional google.protobuf.Timestamp ended_at = 13;
  string thread_id = 14;
}

message JobProgress {
  string job_id = 1;
  JobStatus status = 2;
  optional string current_step_id = 3;
  uint32 progress = 4;
  optional string message = 5;
}

message ToolApprovalAction {
  string tool_call_id = 1;
  string name = 2;
  google.protobuf.Struct args = 3;
  optional string description = 4;
  repeated string allowed_decisions = 5;
}

message ToolApproval {
  string approval_id = 1;
  string checkpoint_id = 2;
  string job_id = 3;
  string session_id = 4;
  string thread_id = 5;
  repeated ToolApprovalAction actions = 6;
}

message ToolApprovalEditedAction {
  string name = 1;
  google.protobuf.Struct args = 2;
}

message ToolApprovalDecision {
  string tool_call_id = 1;
  string type = 2;
  optional ToolApprovalEditedAction edited_action = 3;
  optional string message = 4;
}

message ToolApprovalResponse {
  string approval_id = 1;
  repeated ToolApprovalDecision decisions = 2;
}

message ToolApprovalSubmitRequest {
  string command_id = 1;
  string checkpoint_id = 2;
  repeated ToolApprovalResponse responses = 3;
}

message ToolApprovalCommand {
  string command_id = 1;
  string checkpoint_id = 2;
  string status = 3;
}
