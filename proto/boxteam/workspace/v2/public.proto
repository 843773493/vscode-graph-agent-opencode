syntax = "proto3";

package boxteam.workspace.v2;

import "boxteam/workspace/v2/message.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// 这是公开业务 DTO 的 Protobuf 初始版本；后续以本文件为协议源维护。
// Python Pydantic 模型保留为后端内部校验和业务组装模型，不再生成 TypeScript。

message APIResponse {
  optional int64 code = 1;
  optional string message = 2;
  optional google.protobuf.Struct data = 3;
  string request_id = 4;
}

message AgentDTO {
  string agent_id = 1;
  string name = 2;
  optional string description = 3;
  string model = 4;
  repeated string tools = 5;
  repeated string capabilities = 6;
  repeated AgentProviderDTO providers = 7;
  optional bool workspace_default = 8;
}

message AgentProviderDTO {
  string provider_id = 1;
  string model = 2;
  string custom_llm_provider = 3;
  optional bool workspace_default = 4;
  bool available = 5;
  optional string configuration_error = 6;
}

message AgentStateMessagesDTO {
  string session_id = 1;
  int64 message_count = 2;
  string jsonl = 3;
}

message ArtifactDTO {
  string artifact_id = 1;
  string job_id = 2;
  string type = 3;
  string name = 4;
  string path = 5;
  optional google.protobuf.Struct metadata = 6;
}

message ConfigDTO {
  string default_model = 1;
  string default_orchestration = 2;
  optional int64 max_concurrent_agents = 3;
  optional bool allow_shell_tools = 4;
  repeated string ignored_paths = 5;
  optional bool auto_summarize = 6;
  optional google.protobuf.Struct metadata = 7;
}

message ConfigReloadStatusDTO {
  bool healthy = 1;
  string revision = 2;
  optional bool restart_required = 3;
  optional string reason = 4;
  repeated string changed_sections = 5;
  string last_success_at = 6;
  string last_attempt_at = 7;
  optional string last_error = 8;
  repeated McpCleanupDTO mcp_cleanup = 9;
}

message McpCleanupDTO {
  string server_id = 1;
  string connection_ref = 2;
  string phase = 3;
  bool release_verified = 4;
  optional string error_type = 5;
}

message ConfigSourceDTO {
  reserved 1;
  reserved "path";

  // 逻辑来源闭集：inline、user、user_local、workspace、runtime_override。
  // SQLite 仅为内部 carrier。
  string layer = 2;
  int64 precedence = 3;
  bool loaded = 4;
  optional string source_key = 5;
  string presence = 6;
  optional int64 layer_revision = 7;
  optional string layer_digest = 8;
  optional int64 source_generation = 9;
  // 可寻址来源文件的 URI；没有稳定文件位置时不设置。
  optional string uri = 10;
}

message ConfigSourcesDTO {
  reserved 2;
  reserved "schema_path";

  string revision = 1;
  repeated ConfigSourceDTO sources = 3;
  repeated string runtime_overrides = 4;
  // 配置 schema 文件的 URI；没有可寻址 schema 时不设置。
  optional string schema_uri = 5;
}

message ConfigUpdateRequest {
  optional string default_model = 1;
  optional string default_orchestration = 2;
  optional int64 max_concurrent_agents = 3;
  optional bool allow_shell_tools = 4;
  repeated string ignored_paths = 5;
  optional bool auto_summarize = 6;
}

message ChildThreadListDTO {
  string parent_session_id = 1;
  repeated ChildThreadSummaryDTO items = 2;
  int64 total = 3;
  repeated TeamBoardDTO teams = 4;
}

message ChildThreadSummaryDTO {
  string thread_id = 1;
  google.protobuf.Timestamp created_at = 2;
  optional string delegation_id = 3;
  optional string role = 4;
  optional string subagent_type = 5;
  optional string title = 6;
  optional string collaboration_state = 7;
  optional string admission_state = 8;
  // 子线程合成展示状态；bound 仅表示初始 admission 已绑定，不保证 Job 已开始。
  string status = 9;
  optional ChildThreadRuntimeDTO runtime = 10;
  optional string report_execution_id = 11;
  optional string report_status = 12;
}

message ChildThreadBlockerDTO {
  string kind = 1;
  string reason = 2;
}

message ChildThreadRuntimeDTO {
  string residency = 1;
  bool cold_eligible = 2;
  string execution_state = 3;
  optional google.protobuf.Timestamp last_activity_at = 4;
  optional google.protobuf.Timestamp idle_deadline = 5;
  repeated ChildThreadBlockerDTO blockers = 6;
}

message CursorPage {
  repeated google.protobuf.Struct items = 1;
  optional string next_cursor = 2;
  optional bool has_more = 3;
}

message DeleteSessionResultDTO {
  string session_id = 1;
  string status = 2;
}

message EntityRef {
  string id = 1;
  optional string name = 2;
}

message FileTreeShortcutDTO {
  string path = 1;
  string label = 2;
  string source = 3;
}

message FileTreeShortcutRequest {
  string path = 1;
  optional string label = 2;
}

message GoalJobAccountingDTO {
  optional int64 tokens = 1;
  optional int64 elapsed_seconds = 2;
  optional bool time_closed = 3;
}

message JobControlRequest {
  optional string scope = 1;
  string action = 2;
  optional string agent_id = 3;
  optional string step_id = 4;
  optional string message = 5;
  optional google.protobuf.Struct params = 6;
}

message JobControlResponseDTO {
  string job_id = 1;
  string status = 2;
  string control_state = 3;
  string session_id = 4;
  string thread_id = 5;
}

message JobDTO {
  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp updated_at = 2;
  string job_id = 3;
  string message_id = 4;
  string session_id = 5;
  string mode = 6;
  string status = 7;
  string entry_agent = 8;
  optional int64 progress = 9;
  optional string current_step = 10;
  optional string error_message = 11;
  optional google.protobuf.Struct metadata = 12;
  optional google.protobuf.Timestamp ended_at = 13;
  string thread_id = 14;
}

message JobDispatchSnapshotDTO {
  string session_id = 1;
  string job_id = 2;
  string job_status = 3;
  optional string active_job_id = 4;
  optional string blocked_by_job_id = 5;
  int64 queued_jobs_ahead = 6;
  int64 queued_job_count = 7;
  int64 pending_job_count = 8;
  optional string delivery_policy = 9;
  optional int64 enqueue_sequence = 10;
  optional int64 queue_snapshot_version = 11;
  string thread_id = 12;
}

message JobProgressDTO {
  string job_id = 1;
  string status = 2;
  optional string current_step_id = 3;
  optional int64 progress = 4;
  optional string message = 5;
}

message JobStatusChangedExecutionEventDTO {
  string event_id = 1;
  string session_id = 2;
  optional string job_id = 3;
  google.protobuf.Timestamp time = 4;
  string type = 5;
  JobProgressDTO payload = 6;
}

message JobStepProgressDTO {
  optional string agent_id = 1;
  optional string message = 2;
  optional string phase = 3;
}

message JobStepUpdatedExecutionEventDTO {
  string event_id = 1;
  string session_id = 2;
  optional string job_id = 3;
  google.protobuf.Timestamp time = 4;
  string type = 5;
  JobStepProgressDTO payload = 6;
}

message JobUpdatedExecutionEventDTO {
  string event_id = 1;
  string session_id = 2;
  optional string job_id = 3;
  google.protobuf.Timestamp time = 4;
  string type = 5;
  JobProgressDTO payload = 6;
}

message LLMRequestLogRecordDTO {
  reserved 5;
  reserved "file_path";

  string session_id = 1;
  optional string job_id = 2;
  // handler 结束或失败后组装日志的 epoch 毫秒时刻；文件名的 epoch 纳秒只用于排序。
  int64 timestamp = 3;
  string file_name = 4;
  optional google.protobuf.Struct request = 6;
  optional google.protobuf.Struct response = 7;
  optional google.protobuf.Struct upstream = 8;
}

message McpServerDTO {
  string server_id = 1;
  string transport = 2;
  bool enabled = 3;
  // ready 表示在线；disabled 表示配置禁用；failed 表示原连接不可用；authorization_required 表示标准 OAuth 尚需用户授权。
  string status = 4;
  repeated McpToolDTO tools = 5;
}

message McpToolDTO {
  string tool_id = 1;
  string server_id = 2;
  string remote_name = 3;
  string description = 4;
}

// 工作区连接操作事实；不包含凭据、OAuth state 或敏感授权地址。
message McpConnectionOperationDTO {
  string operation_id = 1;
  string connection_id = 2;
  string server_id = 3;
  string action = 4;
  string status = 5;
  string stage = 6;
  double created_at = 7;
  double deadline = 8;
  double updated_at = 9;
  optional string error_code = 10;
}

message McpConnectionRequestDTO {
  string operation_id = 1;
  string server_id = 2;
  string action = 3;
}

// 仅通过受保护且 no-store 的授权管理 API 向用户提供，不进入模型与 SSE。
message McpAuthorizationDTO {
  string authorization_url = 1;
}

// 仅以受保护 POST body 交给实际 owner，禁止复制到访问日志。
message McpAuthorizationCallbackDTO {
  string code = 1;
  string state = 2;
}

message MessageCreateRequest {
  optional string role = 1;
  string content = 2;
  repeated AttachmentRef attachments = 3;
  optional google.protobuf.Struct metadata = 4;
}

message MessageDTO {
  // 消息创建和更新时刻；事件发布时刻由事件 header.time 独立表示。
  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp updated_at = 2;
  string message_id = 3;
  string session_id = 4;
  string role = 5;
  string content = 6;
  repeated AttachmentRef attachments = 7;
  optional google.protobuf.Struct metadata = 8;
  string thread_id = 9;
}

message MessageReplayAccepted {
  string message_id = 1;
  string job_id = 2;
  string status = 3;
  JobDispatchSnapshotDTO dispatch = 4;
  string session_id = 5;
  string action = 6;
  string replaced_message_id = 7;
  int64 removed_message_count = 8;
  optional bool workspace_changes_reverted = 9;
  string notice = 10;
  string thread_id = 11;
  optional string turn_id = 12;
}

message MessageReplayRequest {
  string action = 1;
  optional string content = 2;
  optional bool acknowledge_context_only = 3;
}

message MessageRunAccepted {
  string message_id = 1;
  string job_id = 2;
  string status = 3;
  JobDispatchSnapshotDTO dispatch = 4;
  string thread_id = 5;
  optional string turn_id = 6;
}

message MessageRunRequest {
  MessageCreateRequest message = 1;
  RunOptions run = 2;
}

message ExtensionCatalogBindingAuditDTO {
  string binding_id = 1;
  string binding_hash = 2;
  string catalog_revision = 3;
  int64 generation = 4;
  string provider_binding_identity = 5;
  string target_id = 6;
  string target_schema_hash = 7;
}

message NodeDebugActionRecordDTO {
  string action_id = 1;
  string session_id = 2;
  string action = 3;
  string message = 4;
  optional string actor = 5;
  optional string tool_name = 6;
  optional string tool_call_id = 7;
  optional string result = 8;
  google.protobuf.Timestamp created_at = 9;
  string thread_id = 10;
  optional ExtensionCatalogBindingAuditDTO extension_catalog_binding = 11;
}

message NodeDebugNoActionParams {}

message NodeDebugSetBreakpointParams {
  string path = 1;
  int64 line = 2;
  optional int64 column = 3;
  optional string condition = 4;
  optional int64 hit_condition = 5;
  optional string log_message = 6;
}

message NodeDebugUpdateBreakpointParams {
  string breakpoint_id = 1;
  optional string path = 2;
  optional int64 line = 3;
  optional int64 column = 4;
  optional string condition = 5;
  optional int64 hit_condition = 6;
  optional string log_message = 7;
}

message NodeDebugClearBreakpointParams {
  string breakpoint_id = 1;
}

message NodeDebugEvaluateParams {
  string expression = 1;
  optional string call_frame_id = 2;
}

message NodeDebugActionRequest {
  string session_id = 1;
  oneof action {
    NodeDebugNoActionParams continue = 2;
    NodeDebugNoActionParams pause = 3;
    NodeDebugNoActionParams step_over = 4;
    NodeDebugNoActionParams step_into = 5;
    NodeDebugNoActionParams step_out = 6;
    NodeDebugSetBreakpointParams set_breakpoint = 7;
    NodeDebugUpdateBreakpointParams update_breakpoint = 8;
    NodeDebugClearBreakpointParams clear_breakpoint = 9;
    NodeDebugEvaluateParams evaluate = 10;
    NodeDebugNoActionParams stop = 11;
  }
  string thread_id = 12;
}

message NodeDebugBreakpointDTO {
  string breakpoint_id = 1;
  string path = 2;
  int64 line = 3;
  optional int64 column = 4;
  optional string condition = 5;
  optional int64 hit_condition = 6;
  optional string log_message = 7;
  optional bool verified = 8;
  optional int64 actual_line = 9;
  optional string inspector_id = 10;
  optional int64 original_line = 11;
  optional string source_line = 12;
  optional string previous_line = 13;
  optional string next_line = 14;
  optional string source_digest = 15;
  optional string relocation_status = 16;
  optional string relocation_message = 17;
  google.protobuf.Timestamp created_at = 18;
}

message NodeDebugBreakpointRequest {
  string path = 1;
  int64 line = 2;
  optional int64 column = 3;
  optional string condition = 4;
  optional int64 hit_condition = 5;
  optional string log_message = 6;
}

message NodeDebugCapabilitiesDTO {
  bool enabled = 1;
  string default_adapter = 2;
  repeated string supported_adapters = 3;
  repeated NodeDebugLaunchProfileDTO launch_profiles = 4;
}

message NodeDebugConfigurationActivateRequest {
  string session_id = 1;
  string thread_id = 2;
}

message NodeDebugConfigurationBreakpointDTO {
  string breakpoint_id = 1;
  string path = 2;
  int64 line = 3;
  optional int64 column = 4;
  optional string condition = 5;
  optional int64 hit_condition = 6;
  optional string log_message = 7;
  optional int64 original_line = 8;
  optional string source_line = 9;
  optional string previous_line = 10;
  optional string next_line = 11;
  optional string source_digest = 12;
  optional string relocation_status = 13;
  optional string relocation_message = 14;
  google.protobuf.Timestamp created_at = 15;
}

message NodeDebugConfigurationCopyRequest {
  string source_session_id = 1;
  string target_session_id = 2;
  optional string name = 3;
  optional bool activate = 4;
  string source_thread_id = 5;
  string target_thread_id = 6;
}

message NodeDebugConfigurationCreateRequest {
  string session_id = 1;
  string name = 2;
  optional string script_path = 3;
  optional string working_directory = 4;
  optional string launch_profile_name = 5;
  repeated string args = 6;
  repeated NodeDebugBreakpointRequest breakpoints = 7;
  optional bool activate = 8;
  string thread_id = 9;
}

message NodeDebugConfigurationDTO {
  optional int64 schema_version = 1;
  string configuration_id = 2;
  string name = 3;
  optional int64 revision = 4;
  optional string script_path = 5;
  optional string working_directory = 6;
  optional string launch_profile_name = 7;
  repeated string args = 8;
  repeated NodeDebugConfigurationBreakpointDTO breakpoints = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message NodeDebugConfigurationImportRequest {
  string session_id = 1;
  NodeDebugConfigurationDTO configuration = 2;
  optional bool activate = 3;
  string thread_id = 4;
}

message NodeDebugConfigurationSummaryDTO {
  string configuration_id = 1;
  string name = 2;
  optional string script_path = 3;
  optional string launch_profile_name = 4;
  optional int64 breakpoint_count = 5;
  optional int64 revision = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message NodeDebugConfigurationUpdateRequest {
  string session_id = 1;
  string name = 2;
  optional string script_path = 3;
  optional string working_directory = 4;
  optional string launch_profile_name = 5;
  repeated string args = 6;
  repeated NodeDebugBreakpointRequest breakpoints = 7;
  string thread_id = 8;
}

message NodeDebugEvaluationDTO {
  string expression = 1;
  optional string value = 2;
  optional string type = 3;
  optional string description = 4;
  optional string error = 5;
  google.protobuf.Timestamp evaluated_at = 6;
}

message NodeDebugLaunchProfileDTO {
  string name = 1;
  string adapter = 2;
  string runtime = 3;
  bool supported = 4;
  optional string program = 5;
  optional string working_directory = 6;
  repeated string args = 7;
}

message NodeDebugSessionManifestDTO {
  optional int64 schema_version = 1;
  string session_id = 2;
  optional string active_configuration_id = 3;
  repeated NodeDebugActionRecordDTO actions = 4;
  google.protobuf.Timestamp updated_at = 5;
  string thread_id = 6;
  repeated string configuration_ids = 7;
}

message NodeDebugStackFrameDTO {
  string call_frame_id = 1;
  string function_name = 2;
  string url = 3;
  optional string path = 4;
  int64 line = 5;
  int64 column = 6;
  repeated string scope_names = 7;
  repeated NodeDebugVariableDTO variables = 8;
}

message NodeDebugStartRequest {
  string session_id = 1;
  optional string configuration_id = 2;
  string path = 3;
  optional string working_directory = 4;
  optional string launch_profile_name = 5;
  repeated string args = 6;
  repeated NodeDebugBreakpointRequest breakpoints = 7;
  string thread_id = 8;
}

message NodeDebugStateDTO {
  string session_id = 1;
  string status = 2;
  optional string active_configuration_id = 3;
  optional string active_configuration_name = 4;
  repeated NodeDebugConfigurationSummaryDTO configurations = 5;
  optional string script_path = 6;
  optional string working_directory = 7;
  optional string launch_profile_name = 8;
  repeated string args = 9;
  optional int64 pid = 10;
  optional string paused_reason = 11;
  optional string error_message = 12;
  repeated NodeDebugStackFrameDTO call_stack = 13;
  optional NodeDebugStackFrameDTO last_stopped_frame = 14;
  repeated NodeDebugBreakpointDTO breakpoints = 15;
  repeated string output = 16;
  optional NodeDebugEvaluationDTO last_evaluation = 17;
  repeated NodeDebugEvaluationDTO evaluations = 18;
  repeated NodeDebugActionRecordDTO actions = 19;
  optional int64 configuration_revision = 20;
  optional bool requires_restart = 21;
  repeated string source_changed_paths = 22;
  string thread_id = 23;
}

message NodeDebugVariableDTO {
  string name = 1;
  string value = 2;
  optional string type = 3;
  optional string object_id = 4;
  optional string scope = 5;
}

message PendingRequestDTO {
  string job_id = 1;
  string message_id = 2;
  string session_id = 3;
  string content = 4;
  repeated AttachmentRef attachments = 5;
  string delivery_policy = 6;
  int64 enqueue_sequence = 7;
  int64 position = 8;
  optional string status = 9;
  optional string waiting_reason = 10;
  optional string last_boundary = 11;
  string agent_id = 12;
  string message_created_at = 13;
  optional google.protobuf.Struct message_metadata = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  int64 snapshot_version = 17;
  optional string gateway_id = 18;
  string thread_id = 19;
  optional string turn_id = 20;
  google.protobuf.Struct execution_binding = 21;
}

message PendingRequestListDTO {
  string session_id = 1;
  optional string active_job_id = 2;
  repeated PendingRequestDTO requests = 3;
  optional int64 snapshot_version = 4;
  // 精确 thread 读取的范围；Session 聚合快照不设置。
  optional string thread_id = 5;
}

message PendingRequestPolicyUpdateRequest {
  string delivery_policy = 1;
  optional int64 expected_snapshot_version = 2;
}

message PendingRequestSummaryDTO {
  string job_id = 1;
  string message_id = 2;
  int64 enqueue_sequence = 3;
  string delivery_policy = 4;
  string status = 5;
  google.protobuf.Timestamp updated_at = 6;
  string thread_id = 7;
}

message PendingRequestSummaryListDTO {
  string session_id = 1;
  optional string active_job_id = 2;
  repeated PendingRequestSummaryDTO requests = 3;
  int64 request_count = 4;
  optional int64 snapshot_version = 5;
  optional bool truncated = 6;
  optional string thread_id = 7;
}

message PermissionRequestDTO {
  string id = 1;
  string session_id = 2;
  string permission = 3;
  repeated string patterns = 4;
  optional google.protobuf.Struct metadata = 5;
  repeated string always = 6;
  optional google.protobuf.Struct tool = 7;
}

message QuestionInfoDTO {
  string question = 1;
  string header = 2;
  repeated QuestionOptionDTO options = 3;
  optional bool multiple = 4;
  optional string question_key = 5;
  optional string header_key = 6;
  optional bool custom = 7;
}

message QuestionOptionDTO {
  string label = 1;
  string description = 2;
  optional string label_key = 3;
  optional string description_key = 4;
  optional string mode = 5;
}

message QuestionRequestDTO {
  string id = 1;
  string session_id = 2;
  repeated QuestionInfoDTO questions = 3;
  optional bool blocking = 4;
  optional google.protobuf.Struct tool = 5;
}

message RunOptions {
  optional string mode = 1;
  optional string agent_id = 2;
  optional string response_mode = 3;
  optional bool async = 4;
  optional int64 max_steps = 5;
  optional int64 timeout_seconds = 6;
  optional google.protobuf.Struct context = 7;
  optional string delivery_policy = 8;
}

message RuntimeDrainBlockerDTO {
  string kind = 1;
  string resource_id = 2;
  string session_id = 3;
  string status = 4;
  optional string detail = 5;
}

message RuntimeDrainResultDTO {
  string lifecycle_state = 1;
  bool accepting_jobs = 2;
  repeated RuntimeDrainBlockerDTO blockers = 3;
  optional int64 interrupted_resources = 4;
}

message RuntimeInfoDTO {
  int64 pid = 1;
  int64 uptime_seconds = 2;
  string workspace_id = 3;
  int64 active_jobs = 4;
  string lifecycle_state = 5;
  bool accepting_jobs = 6;
  repeated RuntimeDrainBlockerDTO blockers = 7;
  repeated string loaded_agents = 8;
  reserved 9;
  reserved "storage";
}

message RuntimeShutdownDTO {
  string status = 1;
  int64 delay_seconds = 2;
}

message RuntimeShutdownResultDTO {
  string status = 1;
  int64 delay_seconds = 2;
}

message RuntimeStatusDTO {
  int64 pid = 1;
  int64 uptime_seconds = 2;
  string workspace_id = 3;
  int64 active_jobs = 4;
  string lifecycle_state = 5;
  bool accepting_jobs = 6;
  repeated RuntimeDrainBlockerDTO blockers = 7;
  repeated string loaded_agents = 8;
  reserved 9;
  reserved "storage";
}

message SessionChangesSummaryDTO {
  optional int64 files = 1;
  optional int64 additions = 2;
  optional int64 deletions = 3;
}

message SessionChangesetDTO {
  string session_id = 1;
  string changeset_id = 2;
  string label = 3;
  optional string description = 4;
  string change_kind = 5;
  optional string turn_id = 6;
  optional string status = 7;
  optional SessionChangesSummaryDTO summary = 8;
  repeated SessionFileChangeDTO files = 9;
  google.protobuf.Timestamp generated_at = 10;
}

message SessionChangesetListDTO {
  string session_id = 1;
  repeated SessionChangesetListItemDTO items = 2;
}

message SessionChangesetListItemDTO {
  string changeset_id = 1;
  string label = 2;
  optional string description = 3;
  string change_kind = 4;
  optional bool is_default = 5;
  optional string turn_id = 6;
  optional SessionChangesSummaryDTO summary = 7;
}

message SessionCompactResultDTO {
  string session_id = 1;
  string status = 2;
  string message = 3;
  int64 before_message_count = 4;
  int64 effective_message_count_before = 5;
  int64 effective_message_count_after = 6;
  int64 summarized_message_count = 7;
  int64 retained_message_count = 8;
  optional string summary = 9;
  reserved 10;
  reserved "history_file_path";
  optional string strategy = 11;
  optional google.protobuf.Timestamp compacted_at = 12;
}

message SessionCompletedExecutionEventDTO {
  string event_id = 1;
  string session_id = 2;
  optional string job_id = 3;
  google.protobuf.Timestamp time = 4;
  string type = 5;
  JobProgressDTO payload = 6;
}

// 仅标识封存来源，不是当前资源定位器或访问凭据。
message SessionContextProvenanceRefDTO {
  string kind = 1;
  string token = 2;
}

message SessionContextResourceDTO {
  optional string display_uri = 1;
  string resource_kind = 2;
  string owner_scope = 3;
  string facet = 4;
