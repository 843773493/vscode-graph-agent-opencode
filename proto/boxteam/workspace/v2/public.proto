message WorkspaceFileRevealDTO {
  string path = 1;
}

message WorkspaceFileUpdateRequest {
  string content = 1;
  string expected_revision = 2;
}

message WorkspaceFileWatchRequest {
  repeated string paths = 1;
  optional int64 after_event_id = 2;
}

// 每个逻辑观察者保留独立的 source、恢复游标和生命周期。
message WorkspaceObservationSubscription {
  string subscription_id = 1;
  string kind = 2;
  optional string session_id = 3;
  optional int64 activity_after = 4;
  optional string trace_after = 5;
  repeated string paths = 6;
  optional int64 files_after = 7;
  // 仅 Trace 观察者使用；省略时保留 Session 聚合视图。
  optional string thread_id = 8;
}

message WorkspaceObservationRequest {
  repeated WorkspaceObservationSubscription subscriptions = 1;
}

// frame 携带领域 owner 的完整原 SSE 帧；物理聚合不重编码领域事件。
message WorkspaceObservationFrameDTO {
  string subscription_id = 1;
  string state = 2;
  optional string frame = 3;
  optional int32 status = 4;
  optional string detail_json = 5;
  // connected 时逻辑 reader 的续读水位；files 是事件序号的十进制字符串，
  // Trace/activity 当前不设置。它不是历史分页 cursor 或路由 revision。
  optional string cursor = 6;
}

message WorkspaceIndexRebuildDTO {
  string status = 1;
  string job_id = 2;
}

message WorkspaceIndexStatusDTO {
  string status = 1;
  optional int64 indexed_files = 2;
  optional string last_updated = 3;
}

// 文本修改与只读导航各自绑定独立能力，不借通信 grant 扩权。
message TextMutationGrantTarget {
  string gateway_id = 1;
  string uri = 2;
  string mutation_kind = 3;
}

message CreateText {
  string target = 1;
  string content = 2;
  string expected_version = 3;
}

message EditText {
  string target = 1;
  string old_string = 2;
  string new_string = 3;
  string expected_version = 4;
  bool replace_all = 5;
}

message PatchText {
  string target = 1;
  string input = 2;
  map<string, string> expected_versions = 3;
  string explanation = 4;
}

message TextMutationRequest {
  oneof command {
    CreateText create = 1;
    EditText edit = 2;
    PatchText patch = 3;
  }
  uint32 timeout_ms = 4;
  uint32 max_response_bytes = 5;
}

message TextMutationRelayRequest {
  string source_gateway_id = 1;
  string source_workspace_id = 2;
  TextMutationGrantTarget mutation_target = 3;
  TextMutationRequest mutation = 4;
}

message TextMutationFileDTO {
  string path = 1;
  optional string operation = 2;
  string state = 3;
  string expected_version = 4;
  optional string intended_version = 5;
  optional bool exists = 6;
  optional string content_hash = 7;
  optional string content_observation_error = 8;
}

message TextMutationReceiptDTO {
  string status = 1;
  string effect = 2;
  optional string target = 3;
  optional string journal_id = 4;
  repeated TextMutationFileDTO files = 5;
  bool retryable = 6;
  string explanation = 7;
  optional uint32 fuzz = 8;
  optional string owner = 9;
  optional string code = 10;
  optional string error_type = 11;
  optional string error = 12;
  optional string recovery = 13;
  optional string lock_release_error = 14;
  optional string journal_error = 15;
}

// 后件由目标 owner 在写入锁内观察；source 不读本机同名文件。
message TextMutationSnapshotDTO {
  string uri = 1;
  bool before_exists = 2;
  string before_content = 3;
  optional bool after_exists = 4;
  optional string after_content = 5;
  optional string after_error = 6;
}

message TextMutationTransferDTO {
  TextMutationReceiptDTO receipt = 1;
  repeated TextMutationSnapshotDTO snapshots = 2;
}

message TaskTriggerDTO {
  string version = 1;
  string type_id = 2;
  optional int64 interval_seconds = 3;
  optional string expression = 4;
  string timezone = 5;
  optional string source_uri = 6;
}

message TaskScriptCheckDTO {
  repeated string command = 1;
  double timeout_seconds = 2;
  int64 output_limit_bytes = 3;
  int64 memory_limit_mb = 4;
}

message TaskConditionDTO {
  string version = 1;
  string type_id = 2;
  optional TaskScriptCheckDTO script = 3;
  optional TaskRuleCheckDTO rule = 4;
  optional TaskModelCheckDTO model = 5;
}

message TaskModelCheckDTO {
  string thread_uri = 1;
  string instruction = 2;
}

message TaskRuleCheckDTO {
  string pointer = 1;
  google.protobuf.Value expected = 2;
}

message TaskContextDTO {
  string version = 1;
  string type_id = 2;
  string content = 3;
  optional string mode = 4;
}

message TaskActionDTO {
  string version = 1;
  string type_id = 2;
  string target_uri = 3;
  string delivery_mode = 4;
  string delivery_policy = 5;
}

message TaskPoliciesDTO {
  string completion = 1;
  string misfire = 2;
  string match_mode = 3;
}

message PersistentTaskConfigurationDTO {
  string name = 1;
  TaskTriggerDTO trigger = 2;
  TaskConditionDTO condition = 3;
  TaskContextDTO context = 4;
  TaskActionDTO action = 5;
  TaskPoliciesDTO policies = 6;
}

message PersistentTaskDTO {
  string task_id = 1;
  string workspace_id = 2;
  int64 revision = 3;
  int64 definition_revision = 4;
  PersistentTaskConfigurationDTO configuration = 5;
  string lifecycle = 6;
  string phase = 7;
  optional string reason = 8;
  bool recovering = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  optional google.protobuf.Timestamp next_run_at = 12;
  // 应用身份与版本；Goal 状态直接投影原 owner，configuration 仅属于 automation。
  string application_type = 13;
  string application_version = 14;
  optional SessionGoalDTO goal = 15;
}

message TaskDecisionDTO {
  string decision = 1;
  string reason = 2;
  google.protobuf.Struct result = 3;
}

message TaskDeliveryDTO {
  string state = 1;
  string source_id = 2;
  optional string item_id = 3;
  optional string source_revision = 4;
  optional string job_id = 5;
  optional string execution_id = 6;
}

message TaskEvaluationDTO {
  string thread_uri = 1;
  string source_item_id = 2;
  string job_id = 3;
  string execution_id = 4;
}

message PersistentTaskRunDTO {
  string run_id = 1;
  string task_id = 2;
  int64 task_revision = 3;
  int64 definition_revision = 4;
  string trigger_key = 5;
  bool check_only = 6;
  string phase = 7;
  optional TaskDecisionDTO decision = 8;
  optional TaskDeliveryDTO delivery = 9;
  optional string error = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  optional string request_id = 13;
  string trigger_type = 14;
  optional google.protobuf.Timestamp scheduled_for = 15;
  optional google.protobuf.Struct trigger_payload = 16;
  optional TaskEvaluationDTO evaluation = 17;
}

message PersistentTaskCreateRequest {
  string idempotency_key = 1;
  PersistentTaskConfigurationDTO configuration = 2;
  optional bool enabled = 3;
}

message PersistentTaskUpdateRequest {
  int64 expected_revision = 1;
  PersistentTaskConfigurationDTO configuration = 2;
}

message PersistentTaskControlRequest {
  int64 expected_revision = 1;
  string action = 2;
}

message PersistentTaskCheckRequest {
  string idempotency_key = 1;
  int64 expected_revision = 2;
  bool check_only = 3;
}

message PersistentTaskNotificationRequest {
  string idempotency_key = 1;
  google.protobuf.Struct payload = 2;
}

message PersistentTaskListDTO {
  repeated PersistentTaskDTO items = 1;
}

message PersistentTaskRunListDTO {
  repeated PersistentTaskRunDTO items = 1;
}
