  // Turn 历史展示状态映射：open→accepted、active→running、completed_empty→completed、interrupted→timed_out、unknown→failed；不是 Job 状态事实。
  string status = 6;
  // 带时区 ISO8601 展示时刻：非空 Turn projection 的 created_at 会先校验为有效且带时区，即使消息自身有时间也不能省略。随后取本次实际加载的首个非 internal HumanMessage 的 response_metadata.created_at，否则取首个已加载消息；候选消息或其时间缺失时，回退已校验的 turns.created_at，两者均无可用时间则报错。非空但非法的消息日期字符串直接报错，不触发回退。消息时间保留显式时区偏移，无时区按 UTC 解释；展示值受 include 加载范围影响。
  google.protobuf.Timestamp created_at = 7;
  // 带时区 ISO8601 展示时刻：取本次所选 canonical Turn projection 的 turns.updated_at；缺少 projection、时刻非法或无时区时历史读取失败，不回退到消息时间；保留显式时区偏移。fork 历史沿用来源投影的原始时刻。
  google.protobuf.Timestamp updated_at = 8;
  // 直接映射 updated_at 的同一时刻，不是独立完成事件，非终态 Turn 也可能有值；fork 历史沿用来源投影的原始时刻。
  optional google.protobuf.Timestamp completed_at = 9;
  optional string items_view = 10;
  repeated string source_message_ids = 11;
  optional int64 source_message_count = 12;
  repeated string merged_job_ids = 13;
  optional int64 merged_job_count = 14;
  optional bool sources_truncated = 15;
  repeated TurnUserMessageSummaryDTO user_messages = 16;
  optional int64 user_message_count = 17;
  optional bool user_messages_truncated = 18;
  optional string response_preview = 19;
  optional bool preview_truncated = 20;
  optional int64 item_count = 21;
  repeated TurnThinkingBlockDTO thinking_blocks = 22;
  repeated TurnToolSummaryDTO tool_summary = 23;
  repeated TurnResponsePartDTO response_parts = 24;
  optional TurnActivityStatsDTO activity_stats = 25;
  int64 root_logical_item_ordinal = 26;
  string source_view_id = 27;
  int64 source_view_revision = 28;
}

message TurnThinkingBlockDTO {
  string kind = 1;
  optional string text = 2;
}

message TurnToolSummaryDTO {
  string tool_name = 1;
  string status = 2;
  // 历史工具聚合引用：已知 emitting ModelCall 时由其 ID 与 Provider 原始 call ID 限定，未知时保留原 call ID；不同 ModelCall 重用同一原始 ID 仍分别展示。
  optional string tool_call_id = 3;
}

message TurnUserMessageDTO {
  string message_id = 1;
  string content = 2;
  optional bool content_truncated = 3;
  repeated TurnAttachmentDTO attachments = 4;
  optional google.protobuf.Struct metadata = 5;
  // canonical 用户消息的不可变创建时刻，接口为带时区 ISO8601；沿消息 response_metadata.created_at，保留显式时区偏移，无时区时按 UTC 解释，缺失时报错。复制保留源消息时间事实。
  google.protobuf.Timestamp created_at = 6;
}

message TurnUserMessageSummaryDTO {
  string message_id = 1;
  optional string preview = 2;
  optional bool content_truncated = 3;
  optional int64 attachment_count = 4;
  // 对应用户消息详情的 created_at，接口为带时区 ISO8601；摘要直接复用详情时间，保留显式时区偏移，详情对无时区值按 UTC 解释，复制保留源消息时间事实。
  google.protobuf.Timestamp created_at = 5;
}

message UiSnapshotResultDTO {
  reserved 1;
  reserved "html_path";
  optional string status = 2;
  string snapshot_id = 3;
  // 显式 workspace API 引用，不包含物理文件位置。
  string html_url = 4;
  string metadata_url = 5;
}

message WorkspaceContextDTO {
  reserved 2;
  reserved "root_path";
  string workspace_id = 1;
  optional string project_type = 3;
  repeated string languages = 4;
  optional google.protobuf.Struct git = 5;
  optional google.protobuf.Struct index_status = 6;
  optional google.protobuf.Struct config = 7;
}

message WorkspaceDTO {
  reserved 2;
  reserved "root_path";
  string workspace_id = 1;
  string name = 3;
  optional string project_type = 4;
  optional google.protobuf.Struct git = 5;
  optional google.protobuf.Struct runtime = 6;
}

message WorkspaceDefaultAgentUpdateRequest {
  string agent_id = 1;
}

message WorkspaceDefaultProviderUpdateRequest {
  string provider_id = 1;
}

message WorkspaceFileChangeBatchDTO {
  repeated WorkspaceFileChangeDTO changes = 1;
  bool overflow = 2;
  repeated WorkspaceDirectoryRevisionDTO directories = 3;
  int64 event_id = 4;
  repeated string invalidated_roots = 5;
  repeated WorkspaceFileListDTO snapshots = 6;
}

message WorkspaceFileChangeDTO {
  string kind = 1;
  string path = 2;
}

message WorkspaceFileContentDTO {
  string root_path = 1;
  string path = 2;
  string name = 3;
  string content = 4;
  string language = 5;
  int64 size = 6;
  optional string modified_at = 7;
  string revision = 8;
}

message WorkspaceFileRootsDTO {
  string workspace_uri = 1;
  string filesystem_uri = 2;
  string filesystem_label = 3;
}

message WorkspaceFileReferencesRequest {
  repeated string paths = 1;
}

message WorkspaceFileReferencesDTO {
  repeated string uris = 1;
}

message WorkspaceFileCopyRequest {
  string source_path = 1;
  optional string source_scope = 2;
  WorkspaceFileMutationIntentDTO intent = 3;
}

message WorkspaceFileCreateRequest {
  string name = 1;
  string kind = 2;
  WorkspaceFileMutationIntentDTO intent = 3;
}

message WorkspaceFileListDTO {
  string root_path = 1;
  string path = 2;
  repeated WorkspaceFileNodeDTO items = 3;
  optional bool truncated = 4;
  optional int64 limit = 5;
  optional string next_cursor = 6;
  WorkspaceDirectoryKeyDTO directory_key = 7;
  int64 directory_revision = 8;
}

message WorkspaceFileNodeDTO {
  string name = 1;
  string path = 2;
  string kind = 3;
  optional bool has_children = 4;
  optional int64 size = 5;
  optional string modified_at = 6;
}

message WorkspaceFilePasteRequest {
  repeated string source_paths = 1;
  WorkspaceFileMutationIntentDTO intent = 2;
}

message WorkspaceDirectoryKeyDTO {
  string workspace_id = 1;
  string scope = 2;
  string root = 3;
  string path = 4;
}

message WorkspaceDirectoryRevisionDTO {
  WorkspaceDirectoryKeyDTO directory_key = 1;
  int64 directory_revision = 2;
  bool exists = 3;
}

message WorkspaceFileMutationIntentDTO {
  string client_operation_id = 1;
  int64 client_sequence = 2;
  optional int64 expected_directory_revision = 3;
  repeated string depends_on = 4;
  optional string created_by_operation_id = 5;
  string relative_child_path = 6;
  optional string directory_revision_from_operation_id = 7;
  optional string client_ref = 8;
  WorkspaceDirectoryKeyDTO directory_key = 9;
}

message WorkspaceFileOperationItemDTO {
  string path = 1;
  string kind = 2;
  string state = 3;
  optional string error = 4;
}

message WorkspaceFileOperationReceiptDTO {
  string operation_id = 1;
  int64 client_sequence = 2;
  int64 queue_seq = 3;
  string kind = 4;
  string state = 5;
  int64 receipt_revision = 6;
  string effect = 7;
  repeated WorkspaceFileOperationItemDTO items = 8;
  repeated WorkspaceDirectoryRevisionDTO directories = 9;
  optional string created_path = 10;
  optional string error_code = 11;
  optional string error_detail = 12;
  repeated WorkspaceFileListDTO snapshots = 13;
}

message WorkspaceFileOperationStatusDTO {
  repeated WorkspaceFileOperationReceiptDTO operations = 1;
  string worker_state = 2;
  optional string worker_error = 3;
