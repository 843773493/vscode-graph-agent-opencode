// 普通只读导航；不携带来源身份、revision、snapshot 或真实路径。
message ResourceNavigationRequest {
  string uri = 1;
  string operation = 2;
  optional string query = 3;
  uint32 limit = 4;
  uint32 max_bytes = 5;
  // 续页绑定目标、操作、查询和读取限制，不包含物理路径。
  optional string cursor = 6;
  // 单次 owner 调用的总预算（毫秒），不为每个文件重新计时。
  uint32 timeout_ms = 7;
