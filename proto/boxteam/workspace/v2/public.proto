  string observation_id = 1;
  string source_call_id = 2;
  string page_identity = 3;
  GlobalThreadAddress source = 4;
  GlobalThreadAddress target = 5;
  string operation = 6;
  google.protobuf.Struct query = 7;
  uint32 page_ordinal = 8;
