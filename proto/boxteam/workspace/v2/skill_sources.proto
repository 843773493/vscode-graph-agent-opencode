syntax = "proto3";

package boxteam.workspace.v2;

import "boxteam/workspace/v2/public.proto";

// 工作区私有网络来源的管理刷新回执，不携带获取地址或正文。
message SkillSourcesRefreshDTO {
  string workspace_id = 1;
  string revision = 2;
  bool available = 3;
}

// 只投影原 owner 已接受的来源 metadata，不传输正文或获取地址。
message SkillSourceMetadataDTO {
  string name = 1;
  string display_uri = 2;
  bool available = 3;
  optional string error_code = 4;
  int64 priority = 5;
}

message SkillSourcesMetadataDTO {
  string workspace_id = 1;
  repeated SkillSourceMetadataDTO entries = 2;
}

// 本地固定 Skill 根的一层文件发现，能力与只读打开共用原导航节点。
message LocalSkillMetadataDTO {
  string name = 1;
  ResourceNavigationNodeDTO node = 2;
}

message LocalSkillsMetadataDTO {
  string workspace_id = 1;
  repeated LocalSkillMetadataDTO entries = 2;
}
