syntax = "proto3";

package boxteam.workspace.v2;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message TraceEvent {
  string event_id = 1;
  // 来源路径提供的部件引用；历史工具路径在已知 emitting ModelCall 时使用其限定的聚合引用，通用 Trace 不承诺所有 part_id 都遵循该格式。
  optional string part_id = 2;
  string session_id = 3;
  string job_id = 4;
  string type = 5;
  string phase = 6;
  string title = 7;
  string content = 8;
  optional string status = 9;
  optional string tool_name = 10;
  repeated string skill_names = 11;
  optional string step_id = 12;
  // 来源事件的带时区时间，Trace 映射保留其时刻与显式时区偏移，不在投影时重新取时；历史工具事件沿对应 canonical 消息/item 时间。
  google.protobuf.Timestamp timestamp = 13;
  google.protobuf.Struct raw = 14;
}
